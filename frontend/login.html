<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyG Express — Iniciar sesión</title>
  <link rel="icon" type="image/png" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-900: #0a2e1a;
      --green-800: #0f3d22;
      --green-700: #155230;
      --green-600: #1a6b3e;
      --green-500: #1f8a4e;
      --green-400: #25a85f;
      --green-300: #3dc97a;
      --green-100: #c8f5da;
      --green-50:  #edfaf3;
      --white:     #ffffff;
      --gray-100:  #f4f6f5;
      --gray-400:  #9aada3;
      --gray-600:  #5a6e64;
      --shadow-lg: 0 24px 64px rgba(10,46,26,0.18);
      --shadow-sm: 0 4px 16px rgba(10,46,26,0.10);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: var(--green-900);
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 64px;
      background: var(--green-900);
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,168,95,0.15) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
    }

    .left-panel::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,168,95,0.10) 0%, transparent 70%);
      bottom: -80px;
      right: -60px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: var(--green-400);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--white);
      letter-spacing: -0.5px;
    }

    .brand-name span {
      color: var(--green-300);
    }

    .left-content {
      z-index: 1;
    }

    .left-content h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 3.5vw, 3rem);
      color: var(--white);
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin-bottom: 20px;
    }

    .left-content h1 em {
      font-style: normal;
      color: var(--green-300);
    }

    .left-content p {
      font-size: 1rem;
      color: var(--gray-400);
      line-height: 1.7;
      max-width: 380px;
    }

    .stats-row {
      display: flex;
      gap: 32px;
      z-index: 1;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-number {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      color: var(--white);
      letter-spacing: -1px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--gray-400);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── RIGHT PANEL (form) ── */
    .right-panel {
      width: 480px;
      min-width: 420px;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 52px;
      position: relative;
    }

    .form-container {
      width: 100%;
      max-width: 360px;
    }

    .form-header {
      margin-bottom: 40px;
    }

    .form-header h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      color: var(--green-900);
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }

    .form-header p {
      font-size: 0.9rem;
      color: var(--gray-600);
    }

    /* ── FORM ── */
    #login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--green-800);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--gray-400);
      fill: none;
      stroke-width: 1.8;
      pointer-events: none;
      transition: stroke 0.2s;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1.5px solid #dde8e3;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--green-900);
      background: var(--gray-100);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: var(--green-400);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(37,168,95,0.12);
    }

    .input-wrap input:focus + svg,
    .input-wrap:focus-within svg {
      stroke: var(--green-400);
    }

    /* icon after input trick — reorder in HTML */
    .input-wrap input:focus ~ svg { stroke: var(--green-400); }

    /* ── ERROR MSG ── */
    #login-error {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #fff3f3;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      font-size: 0.875rem;
      color: #b91c1c;
    }

    #login-error svg { 
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: #b91c1c;
      fill: none;
      stroke-width: 2;
    }

    /* ── SUBMIT BUTTON ── */
    #btn-login {
      width: 100%;
      padding: 14px;
      background: var(--green-500);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    #btn-login:hover:not(:disabled) {
      background: var(--green-600);
      box-shadow: 0 8px 24px rgba(31,138,78,0.35);
      transform: translateY(-1px);
    }

    #btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    #btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ── SPINNER ── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── FOOTER FORM ── */
    .form-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--gray-400);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 860px) {
      .left-panel { display: none; }
      .right-panel { width: 100%; min-width: unset; }
    }

    /* ── ENTRY ANIMATION ── */
    .form-container {
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M20 8H4a2 2 0 00-2 2v8a2 2 0 002 2h16a2 2 0 002-2v-8a2 2 0 00-2-2zm-9 8H7v-2h4v2zm6-4H7v-2h10v2zM20 4H4L2 8h20l-2-4z"/></svg>
      </div>
      <div class="brand-name">MyG <span>Express</span></div>
    </div>

    <div class="left-content">
      <h1>Sistema de<br>mensajería<br><em>logística</em></h1>
      <p>Gestiona lotes diarios, envía avisos por WhatsApp y controla tus sesiones desde un solo panel.</p>
    </div>

    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-number">140+</span>
        <span class="stat-label">Paquetes / día</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">Multi</span>
        <span class="stat-label">Sede</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">100%</span>
        <span class="stat-label">WhatsApp</span>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="form-container">
      <div class="form-header">
        <h2>Bienvenido</h2>
        <p>Ingresa tus credenciales para continuar</p>
      </div>

      <form id="login-form" autocomplete="off" novalidate>

        <!-- Error -->
        <div id="login-error">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span></span>
        </div>

        <!-- Usuario -->
        <div class="field">
          <label for="input-usuario">Usuario</label>
          <div class="input-wrap">
            <input
              type="text"
              id="input-usuario"
              name="usuario"
              placeholder="tu usuario"
              autocomplete="username"
              required
            />
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="input-password">Contraseña</label>
          <div class="input-wrap">
            <input
              type="password"
              id="input-password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="btn-login">Ingresar</button>

      </form>

      <div class="form-footer">
        MyG Express &copy; 2026 — Panel Administrativo
      </div>
    </div>
  </div>

  <script src="js/runtime-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
